async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

const SB_URL="https://jnagpgurczbskxvbnubk.supabase.co",SB_KEY="sb_publishable_YiIHYkn8TnQ-8j8Hg6Vsgw_t7iAEW3m";

function brk(s,v){const SW=/^(de|du|des|d[’']|la|le|l[’']|au|à)$/i;
 return s.replace(/\(\s*\{(?!\{)([^{}]*?)\}\s*\)|(?<!\{)\{(?!\{)([^{}]*?)\}(?!\})/g,(m,c1,c2,off,str)=>{const c=(c1??c2??"").trim();
  if(!c||/^[.…_\s]+$/.test(c)){const w=str.slice(0,off).replace(/[\s:(]+$/,"").split(/\s+/).slice(-4);while(w.length&&SW.test(w[w.length-1]))w.pop();for(let n=Math.min(3,w.length);n>0;n--){const x=al(w.slice(-n).join(" "));if(x&&x in v){FC++;US.add(x);return esc(v[x])}}return""}
  if(/^[eé]{1,2}(\(e\))?$/i.test(c))return"";
  const P=c.split("/").map(p=>p.trim()).filter(Boolean),L=P.map(nk);
  if(L.length==2&&L.includes("cadre")&&L.includes("agent")){FC++;US.add("statut");return v.statut.toLowerCase()}
  if(L.length==2&&L.includes("monsieur")&&L.includes("madame")){FC++;return v.civilite}
  const X=P.map(al);if(P.length&&X.every(x=>x&&x in v)){FC++;X.forEach(x=>US.add(x));return X.map(x=>esc(v[x])).join(" ")}
  return""})}

const DICO=[["Affectation","nom f.","Action d’assigner un agent à un poste ou à un service.","Son affectation à la Direction des études a pris effet en janvier."],["Ampliation","nom f.","Copie conforme d’un acte envoyée à un destinataire pour information.","L’arrêté est transmis en ampliation aux directions concernées."],["Arrêté","nom m.","Décision administrative écrite prise par une autorité.","Un arrêté fixe les conditions de l’examen."],["Attestation","nom f.","Document officiel qui certifie un fait ou une situation.","Une attestation de services prouve qu’un agent travaille dans l’institution."],["Avancement","nom m.","Passage d’un agent à un grade ou à un échelon supérieur.","Il a bénéficié d’un avancement de grade."],["Bureau","nom m.","Plus petite unité d’une administration, placée dans une division.","Le bureau du courrier traite les lettres reçues."],["Cadre","nom m.","Agent de niveau supérieur qui exerce des responsabilités de direction ou d’encadrement.","Les grades 110 à 140 sont ceux des cadres dans cette application."],["Circulaire","nom f.","Texte adressé à plusieurs services pour expliquer ou appliquer une règle.","Une circulaire rappelle les horaires de travail."],["Commission d’affectation","nom f.","Acte qui nomme un agent à un poste ou à un service.","La commission d’affectation est remise à l’agent."],["Congé de maternité","nom m.","Repos accordé à une agente avant et après l’accouchement.","Elle a demandé son congé de maternité."],["Congé de reconstitution","nom m.","Congé accordé à l’agent pour se reposer et reprendre des forces.","Il est parti en congé de reconstitution."],["Décision","nom f.","Choix officiel pris par une autorité qui produit un effet.","La décision est notifiée à l’intéressé."],["Direction","nom f.","Grande structure d’une administration, qui regroupe des divisions.","La Direction des services généraux gère le personnel."],["Division","nom f.","Structure placée sous une direction et qui regroupe des bureaux.","Le chef de division supervise trois bureaux."],["Dossier","nom m.","Ensemble des pièces qui concernent une personne ou une affaire.","Le dossier de l’agent contient l’arrêté et la notification."],["Émargement","nom m.","Signature placée en face d’un nom pour prouver une présence ou une réception.","La liste d’émargement circule à la réunion."],["Engagement","nom m.","Entrée officielle d’un agent dans l’administration.","Sa date d’engagement est inscrite dans sa fiche."],["Fonction","nom f.","Tâche ou rôle qu’un agent exerce dans un service.","Il occupe la fonction de chef de bureau."],["Grade","nom m.","Niveau de classement d’un agent dans la hiérarchie.","Son grade est 120."],["Habilitation","nom f.","Autorisation officielle d’accomplir un acte ou d’accéder à une information.","Seul un agent habilité signe ce document."],["Hiérarchie","nom f.","Organisation des niveaux d’autorité dans une administration.","Le courrier suit la voie hiérarchique."],["Intérim","nom m.","Exercice temporaire d’une fonction à la place du titulaire.","Il assure l’intérim du directeur absent."],["Matricule","nom m.","Numéro unique qui identifie un agent.","Le matricule figure sur chaque lettre."],["Mutation","nom f.","Changement d’affectation d’un agent d’un service à un autre.","Sa mutation vers Lubumbashi est effective."],["Nomination","nom f.","Acte qui confie une fonction ou un grade à une personne.","Sa nomination est publiée."],["Note de service","nom f.","Écrit interne qui donne une instruction aux agents d’un service.","Une note de service fixe le planning."],["Notification","nom f.","Action de porter officiellement un acte à la connaissance de l’intéressé.","La notification est remise contre signature."],["Ordre de mission","nom m.","Document qui autorise un agent à se déplacer pour le service.","L’ordre de mission précise la destination et la durée."],["Organigramme","nom m.","Schéma qui montre comment une organisation est structurée.","L’organigramme affiche les directions."],["Procès-verbal","nom m.","Compte rendu écrit officiel d’une réunion ou d’un constat.","Le procès-verbal est signé par tous les membres."],["Promotion","nom f.","Accès à un grade ou à un poste plus élevé.","Sa promotion récompense dix ans de service."],["Recommandation médicale","nom f.","Document qui appuie une demande de soins pour un agent ou sa famille.","La recommandation médicale concerne son enfant."],["Signataire","nom m.","Personne qui signe un acte et l’engage ainsi officiellement.","Le secrétaire général est signataire de l’attestation."],["Statut","nom m.","Ensemble des règles qui encadrent la situation d’un agent.","Le statut définit ses droits et devoirs."],["Suppléant","nom m.","Personne qui remplace temporairement une autre.","Le suppléant dirige la réunion."],["Titulaire","nom m.","Personne qui occupe officiellement un poste ou qui détient un droit.","L’agent titulaire du dossier est le bénéficiaire principal."],["Validation","nom f.","Contrôle qui confirme qu’un document est correct avant son usage.","La validation du vérificateur autorise l’impression."],["Visa","nom m.","Mention d’approbation placée par une autorité sur un document.","Le directeur appose son visa sur le projet."]];
const dn=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const dicoAll=()=>[...DICO,...(S.dico||[])].sort((a,b)=>a[0].localeCompare(b[0],"fr"));
function dicoShow(r){const el=$("#dl");if(!el)return;const t=dn($("#dk").value.trim());let L=r?[r]:dicoAll().filter(w=>!t||dn(w[0]).includes(t)||dn(w[2]).includes(t));
 el.innerHTML=`<p class="mut">${L.length} mot(s)</p>`+(L.map(w=>`<div class="dw"><b>${esc(w[0])}</b> <i class="mut">${esc(w[1]||"")}</i><p>${esc(w[2])}</p>${w[3]?`<p class="mut">Exemple : ${esc(w[3])}</p>`:""}</div>`).join("")||`<p class="mut">Aucun mot trouvé. Essayez une autre orthographe.</p>`)}
function dicoRand(){const A=dicoAll();$("#dk").value="";dicoShow(A[Math.floor(Math.random()*A.length)])}
function addWord(){if(!isAdm())return;const m=$("#dm").value.trim(),d=$("#dd").value.trim();if(!m||!d)return toast("Saisissez le mot et sa définition.");(S.dico=S.dico||[]).push([m,"",d,""]);save();$("#dm").value="";$("#dd").value="";dicoShow();toast("Mot ajouté.")}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return d[b.length]}
function al(l){const k=nk(l);if(AL[k])return AL[k];if(k.length<7)return null;let b=null,bd=3;for(const q in AL)if(q.length>=7){const e=lev(k,q);if(e<bd){bd=e;b=AL[q]}}return b}

function frDlg(id,i){const o=["Avion","Véhicule de service","Bus","Train","Bateau","Autre"];ov(`<div class="mdl"><h3 style="margin-top:0">Informations de la feuille de route</h3><label>Destination<input id="fd"></label><label>Nature du déplacement<input id="fn" placeholder="Mission, formation, service commandé…"></label><label>Date de départ<input id="fa" type="date" onchange="frDur()"></label><label>Date d’arrivée<input id="fb" type="date" onchange="frDur()"></label><label>Durée (jours)<input id="fj" type="number" min="1"></label><label>Moyen de déplacement<select id="fm">${o.map(x=>`<option>${x}</option>`).join("")}</select></label><div class="row"><button class="pri" onclick="frGo('${id}',${i})">Générer</button><button onclick="closeOv()">Annuler</button></div></div>`)}

function tpls(){return`<h2>Bibliothèque de modèles</h2><p class="mut">Formats lus ici : .docx, .html, .txt. Variables : {{nom}}, {{postnom}}, {{prenom}}, {{matricule}}, {{grade}}, {{fonction}}, {{direction}}, {{division}}, {{bureau}}, {{date}}, {{e}}, {{date_naissance}}. Feuille de route : {{destination}}, {{nature_deplacement}}, {{duree}}, {{date_depart}}, {{date_arrivee}}, {{moyen_deplacement}}. Accords : [le demandeur|la demanderesse], [accordé|accordée].</p><div class="sc"><table>${docs().map((n,i)=>{const t=S.tpls[n];return`<tr><td>${esc(n)}<td>${t?`<span class="tag ok">Importé : ${esc(t.file)}</span>`:i==5?`<span class="tag ok">Modèle par défaut intégré</span>`:`<span class="tag no">Modèle manquant</span>`}<td><input type="file" accept=".docx,.html,.htm,.txt,.md" onchange="imp(${i},this)">${t?`<button class="dg" onclick="delT(${i})">Supprimer</button>`:""}</tr>`}).join("")}</table></div><h3>Ajouter un nouveau type de document</h3><div class="row"><input id="nt" placeholder="Nom du document"><button onclick="addT()">Ajouter</button></div>`}
async function imp(i,e){const f=e.files[0];if(!f)return;const n=docs()[i],x=f.name.split(".").pop().toLowerCase();let kind,body;
 try{if(x=="docx"){const z=await JSZip.loadAsync(await f.arrayBuffer()),d=new DOMParser().parseFromString(await z.file("word/document.xml").async("string"),"application/xml");body=[...d.getElementsByTagName("w:p")].map(p=>[...p.getElementsByTagName("w:t")].map(t=>t.textContent).join("")).join("\n");kind="text"}
 else if(x=="html"||x=="htm"){kind="html";body=await f.text()}else if(x=="txt"||x=="md"){kind="text";body=await f.text()}
 else return toast("Format non lisible dans le navigateur (PDF, Excel…). Convertissez le modèle en .docx, .html ou .txt.");
 S.tpls[n]={kind,body,file:f.name};if(save()){render();toast("Modèle importé.")}}catch(er){toast("Fichier illisible ou protégé.")}}
